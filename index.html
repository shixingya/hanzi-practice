<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>汉字笔顺闯关</title>
<script>
(function(){
  var cdns=['https://cdn.jsdelivr.net/npm/hanzi-writer@3.0.0/dist/hanzi-writer.min.js','https://unpkg.com/hanzi-writer@3.0.0/dist/hanzi-writer.min.js','https://cdnjs.cloudflare.com/ajax/libs/hanzi-writer/3.0.0/hanzi-writer.min.js'];
  var i=0;
  function tryLoad(){if(typeof HanziWriter!=='undefined')return;if(i>=cdns.length){window._hwFailed=true;return;}var s=document.createElement('script');s.src=cdns[i];s.onload=function(){window._hwLoaded=true;};s.onerror=function(){i++;tryLoad();};document.head.appendChild(s);}
  tryLoad();
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"KaiTi","楷体",STKaiti,"Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.screen{display:none;width:100%;max-width:520px;flex-direction:column;align-items:center;padding:10px 16px;animation:fadeIn .4s ease}
.screen.active{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.top-bar{width:100%;display:flex;justify-content:space-between;align-items:center;padding:8px 0;color:#fff;font-size:14px}
.top-bar .back-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 14px;border-radius:15px;cursor:pointer;font-size:14px;font-family:inherit}
.top-bar .back-btn:hover{background:rgba(255,255,255,.35)}
.stats{display:flex;gap:12px}
.stats span{background:rgba(255,255,255,.15);padding:4px 10px;border-radius:12px;font-size:13px}
.home-title{text-align:center;margin:20px 0 10px;color:#fff}
.home-title h1{font-size:32px;text-shadow:2px 2px 8px rgba(0,0,0,.3);margin-bottom:6px}
.home-title p{font-size:16px;opacity:.85}
.mode-cards{display:flex;flex-direction:column;gap:14px;width:100%;margin:16px 0}
.mode-card{background:#fff;border-radius:20px;padding:20px 24px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.mode-card:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.mode-card:active{transform:scale(.97)}
.mode-card .icon{font-size:42px;flex-shrink:0}
.mode-card .info h3{font-size:18px;color:#333;margin-bottom:4px}
.mode-card .info p{font-size:13px;color:#888}
.collection-btn{background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.4);color:#fff;padding:10px 24px;border-radius:20px;cursor:pointer;font-size:15px;font-family:inherit;margin:10px 0;transition:background .2s}
.collection-btn:hover{background:rgba(255,255,255,.3)}
.quiz-header{width:100%;text-align:center;margin:8px 0}
.quiz-header .level{font-size:14px;color:rgba(255,255,255,.8);margin-bottom:4px}
.quiz-header .question{font-size:22px;color:#fff;font-weight:bold;text-shadow:1px 1px 4px rgba(0,0,0,.3)}
.char-box{width:260px;height:260px;background:#fff;border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.2);position:relative;overflow:hidden;margin:10px 0}
.char-box::before,.char-box::after{content:'';position:absolute;background:#f0f0f0;pointer-events:none;z-index:0}
.char-box::before{width:1px;height:70%;top:15%;left:50%}
.char-box::after{height:1px;width:70%;left:15%;top:50%}
.char-box svg{position:relative;z-index:1}
.stroke-labels{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5}
.stroke-num{position:absolute;width:26px;height:26px;border-radius:50%;background:#1E88E5;color:#fff;font-size:12px;font-weight:bold;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);pointer-events:auto;cursor:pointer;transition:transform .3s,background .3s}
.stroke-num:hover{transform:scale(1.3)}
.stroke-num.active{background:#FF6F00;transform:scale(1.4)}
.stroke-num.done{background:#43A047}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin:12px 0}
.opt-btn{padding:16px 10px;border:none;border-radius:16px;font-size:20px;font-family:inherit;cursor:pointer;background:#fff;color:#333;box-shadow:0 3px 12px rgba(0,0,0,.12);transition:transform .15s,background .3s,box-shadow .3s}
.opt-btn:hover{transform:scale(1.05);box-shadow:0 5px 16px rgba(0,0,0,.18)}
.opt-btn:active{transform:scale(.95)}
.opt-btn.correct{background:#4CAF50;color:#fff;animation:popCorrect .5s ease}
.opt-btn.wrong{background:#f44336;color:#fff;animation:shakeWrong .5s ease}
.opt-btn.reveal{background:#81C784;color:#fff}
.opt-btn:disabled{cursor:default;opacity:.7}
@keyframes popCorrect{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shakeWrong{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.feedback{min-height:30px;font-size:16px;color:#fff;text-align:center;margin:4px 0}
.combo-display{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:bold;color:#FFD700;text-shadow:0 0 20px rgba(255,215,0,.8),2px 2px 4px rgba(0,0,0,.5);pointer-events:none;z-index:999;animation:comboAnim 1s ease-out forwards;opacity:0}
@keyframes comboAnim{0%{opacity:0;transform:translate(-50%,-50%) scale(0)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}60%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.star-fly{position:fixed;font-size:24px;pointer-events:none;z-index:998;animation:starFly 1s ease-out forwards}
@keyframes starFly{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(.5)}}
.write-area{cursor:crosshair}
.write-controls{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap;justify-content:center}
.w-btn{padding:12px 20px;border:none;border-radius:20px;font-size:15px;font-family:inherit;cursor:pointer;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.2);transition:transform .2s}
.w-btn:active{transform:scale(.93)}
.w-btn.blue{background:linear-gradient(135deg,#42A5F5,#1E88E5)}
.w-btn.orange{background:linear-gradient(135deg,#FFA726,#FB8C00)}
.w-btn.green{background:linear-gradient(135deg,#66BB6A,#43A047)}
.labels-info{width:100%;background:rgba(255,255,255,.12);border-radius:14px;padding:12px 16px;margin:8px 0;color:#fff;font-size:14px;text-align:center}
.collection-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;margin:16px 0}
.collect-card{background:#fff;border-radius:16px;padding:16px 8px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.1);transition:transform .2s}
.collect-card.locked{opacity:.4;filter:grayscale(1)}
.collect-card .emoji{font-size:36px;display:block;margin-bottom:6px}
.collect-card .name{font-size:12px;color:#666}
.collect-card .need{font-size:11px;color:#aaa;margin-top:4px}
.reward-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);display:none;justify-content:center;align-items:center;z-index:1000;flex-direction:column}
.reward-overlay.active{display:flex}
.reward-animal{font-size:100px;z-index:1001;animation:animalBounce 2s ease-in-out forwards}
@keyframes animalBounce{0%{transform:scale(0) translateY(100px);opacity:0}15%{transform:scale(1.3) translateY(-40px);opacity:1}25%{transform:scale(1) translateY(0)}35%{transform:scale(1.15) translateY(-25px)}45%{transform:scale(1) translateY(0)}100%{transform:scale(1);opacity:1}}
.reward-text{font-size:32px;color:#FFD54F;z-index:1001;margin-top:16px;text-shadow:2px 2px 6px rgba(0,0,0,.5);animation:textPop .8s ease-out forwards;opacity:0;font-weight:bold}
@keyframes textPop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}
.confetti{position:absolute;width:10px;height:10px;border-radius:2px;animation:confettiFall 3s ease-in forwards}
@keyframes confettiFall{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.reward-bg{position:absolute;width:100%;height:100%;overflow:hidden}
.progress-bar-wrap{width:100%;height:8px;background:rgba(255,255,255,.2);border-radius:4px;margin:6px 0;overflow:hidden}
.progress-bar-inner{height:100%;background:linear-gradient(90deg,#FFD700,#FFA000);border-radius:4px;transition:width .5s ease}
.status-line{color:rgba(255,255,255,.9);font-size:15px;margin:6px 0;text-align:center;min-height:22px}
@media(max-width:420px){.char-box{width:220px;height:220px}.home-title h1{font-size:26px}.mode-card{padding:14px 16px}.mode-card .icon{font-size:32px}.options{gap:8px}.opt-btn{padding:12px 8px;font-size:18px}}
</style>
</head>
<body>
<!-- 首页 -->
<div class="screen active" id="screen-home">
  <div class="home-title">
    <h1>汉字笔顺闯关</h1>
    <p id="homeGreeting">今天也要加油哦！</p>
  </div>
  <div class="stats" style="margin:8px 0">
    <span id="homeStars">⭐ 0</span>
    <span id="homeCombo">🔥 最高连击 0</span>
    <span id="homeAnimals">🐼 收藏 0/8</span>
  </div>
  <div class="mode-cards">
    <div class="mode-card" onclick="enterMode('quiz')">
      <div class="icon">⚔️</div>
      <div class="info"><h3>笔顺大闯关</h3><p>选择题答题，赚星星！</p></div>
    </div>
    <div class="mode-card" onclick="enterMode('labels')">
      <div class="icon">🔍</div>
      <div class="info"><h3>火眼金睛</h3><p>看编号，学笔顺</p></div>
    </div>
    <div class="mode-card" onclick="enterMode('write')">
      <div class="icon">✏️</div>
      <div class="info"><h3>妙笔生花</h3><p>鼠标描红练写字</p></div>
    </div>
  </div>
  <button class="collection-btn" onclick="enterMode('collection')">🎁 我的收藏</button>
</div>
<!-- 笔顺大闯关 -->
<div class="screen" id="screen-quiz">
  <div class="top-bar">
    <button class="back-btn" onclick="goHome()">← 返回</button>
    <div class="stats"><span id="quizStars">⭐ 0</span><span id="quizCombo">🔥 x0</span><span id="bgmToggle" onclick="toggleBGM()" style="cursor:pointer">🔊 音乐</span></div>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar-inner" id="quizProgress"></div></div>
  <div class="quiz-header">
    <div class="level" id="quizLevel">第 1 关</div>
    <div class="question" id="quizQuestion">「大」的第一笔是什么？</div>
  </div>
  <div class="char-box" id="quizCharBox"></div>
  <div class="options" id="quizOptions"></div>
  <div class="feedback" id="quizFeedback"></div>
</div>
<!-- 火眼金睛 -->
<div class="screen" id="screen-labels">
  <div class="top-bar">
    <button class="back-btn" onclick="goHome()">← 返回</button>
    <div class="stats"><span id="labelCharName">-</span></div>
  </div>
  <div class="char-box" id="labelCharBox">
    <div class="stroke-labels" id="strokeLabels"></div>
  </div>
  <div class="labels-info" id="labelsInfo">点击编号查看笔画</div>
  <div class="write-controls">
    <button class="w-btn blue" onclick="labelsPlay()">▶ 播放笔顺</button>
    <button class="w-btn green" onclick="labelsNext()">下一个 →</button>
  </div>
</div>
<!-- 妙笔生花 -->
<div class="screen" id="screen-write">
  <div class="top-bar">
    <button class="back-btn" onclick="goHome()">← 返回</button>
    <div class="stats"><span id="writeStars">⭐ 0</span><span id="writeCount">已写 0 字</span></div>
  </div>
  <div class="status-line" id="writeStatus">看好了，跟着笔顺写！</div>
  <div class="char-box write-area" id="writeCharBox"></div>
  <div class="write-controls">
    <button class="w-btn blue" onclick="writeDemo()">看笔顺</button>
    <button class="w-btn orange" onclick="writeRetry()">再写一次</button>
    <button class="w-btn green" onclick="writeNext()">换一个</button>
  </div>
</div>
<!-- 我的收藏 -->
<div class="screen" id="screen-collection">
  <div class="top-bar">
    <button class="back-btn" onclick="goHome()">← 返回</button>
    <div class="stats"><span id="colStars">⭐ 0</span></div>
  </div>
  <h2 style="color:#fff;margin:12px 0;font-size:22px">🎁 动物收藏馆</h2>
  <p style="color:rgba(255,255,255,.7);font-size:14px;margin-bottom:8px">每收集 50 颗星星解锁一只动物</p>
  <div class="collection-grid" id="collectionGrid"></div>
</div>
<!-- 彩蛋 -->
<div class="reward-overlay" id="rewardOverlay">
  <div class="reward-bg" id="rewardBg"></div>
  <div class="reward-animal" id="rewardAnimal"></div>
  <div class="reward-text" id="rewardText"></div>
</div>
<script>
// ===== 字库 =====
const CHARS=['一','二','三','十','人','八','大','小','上','下','口','日','月','水','火','山','石','田','木','禾','米','白','云','女','儿','子','了','不','在','有','是','我','你','他','的','来','去','会','个','中','长','门','出','开','见','对','妈','爸','哥','姐','书','读','写','字','本','笔','春','风','冬','花','飞','入','姓','什','么','双','国','王','方','青','清','气','晴','情','请','生','时','动','万','吃','叫','主','住','没','以','后','更','种','样','伙','伴','玩','前','再','成','片','回','事','知','道','声','笑','跑','走','坐','站','看','听','说','唱','画','草','林','鸟','虫','鱼','牛','马','羊','猫','狗','宜','实','色','华','谷','金','尽','层','照','炉','烟','挂','川','劳','尤','其','区','巨','它','安','块','站','豆','识','经','首','于','枝','记','湖','莲','穷','荷','绝','含','窗','岭','鸣','闻','客','何','好','思','乡','整','修','建','真','城','市','民','族','神','祖','洁','欢','庆','旗','曲','找','脱','探','冻','野','烧','村','居','醉','童','散','忙','丝','剪','冲','邮','递','植','注','满','休','息','贝','甲','钱','购','烤','切','保','护','卫','病','医','药','使','便','教','室','操','场','体','育','温','暖','冷','热','凉','甜','苦','酸','辣'];
const DIRS=[{icon:'➡️',label:'往右',code:'R'},{icon:'⬇️',label:'往下',code:'D'},{icon:'↙️',label:'往左下',code:'P'},{icon:'↘️',label:'往右下',code:'N'},{icon:'↗️',label:'往右上',code:'T'}];
const VOICE_PRAISE=['太棒了！','你真厉害！','答对啦，真聪明！','好样的！','太厉害了！','继续加油！','你真棒！','完全正确！'];
const REWARDS=[{e:'🐼',n:'熊猫'},{e:'🐵',n:'猴子'},{e:'🐰',n:'兔子'},{e:'🐱',n:'小猫'},{e:'🐶',n:'小狗'},{e:'🐘',n:'大象'},{e:'🐧',n:'企鹅'},{e:'🐯',n:'老虎'}];
const PRAISES=['太棒了！','你真厉害！','继续加油！','真聪明！','太厉害了！','写得真好！','真了不起！','好样的！','棒极了！','太优秀了！'];
const CONFETTI_COLORS=['#FF6B6B','#4ECDC4','#45B7D1','#FFA07A','#98D8C8','#FFD93D','#C9B1FF','#FF90BC'];
// ===== 状态 =====
let stars=parseInt(localStorage.getItem('hz_stars'))||0;
let maxCombo=parseInt(localStorage.getItem('hz_maxCombo'))||0;
let collected=JSON.parse(localStorage.getItem('hz_collected')||'[]');
let combo=0, quizLevel=0, writeTotal=0;
let charDataCache={}, charQueue=[], queueIdx=0;
let writer=null, currentChar='', currentMode='';
let strokeTypes={};
// ===== 音效 =====
let audioCtx=null;
function getAC(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function tone(f,d,t){try{const c=getAC(),o=c.createOscillator(),g=c.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(.18,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);}catch(e){}}
function sndOk(){tone(880,.12);setTimeout(()=>tone(1100,.15),80);}
function sndNo(){tone(220,.3,'square');}
function sndDone(){tone(523,.1);setTimeout(()=>tone(659,.1),100);setTimeout(()=>tone(784,.2),200);}
function sndReward(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.15),i*120));}
function sndStar(){tone(1200,.08);setTimeout(()=>tone(1500,.1),60);}
// ===== 笔画方向检测 =====
function detectDir(median){
  if(!median||median.length<2)return'R';
  var n=median.length,dx=median[n-1][0]-median[0][0],dy=median[n-1][1]-median[0][1];
  if(Math.abs(dx)<60&&Math.abs(dy)<60)return'D'; // 点视为往下
  var angle=Math.atan2(dy,dx)*180/Math.PI; // y-up: 正=上, 负=下
  if(angle>=-25&&angle<25)return'R'; // 横
  if(angle>=-115&&angle<-65)return'D'; // 竖
  if(angle>=-180&&angle<-115)return'P'; // 撇(左下)
  if(angle>=-65&&angle<-25)return'N'; // 捺(右下)
  if(angle>=25&&angle<80)return'T'; // 提(右上)
  if(angle>=80)return'R';
  return'R';
}
// ===== 数据加载 =====
async function loadCharData(ch){
  if(charDataCache[ch])return charDataCache[ch];
  var bases=['https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0','https://unpkg.com/hanzi-writer-data@2.0'];
  for(var b of bases){
    try{var r=await fetch(b+'/'+ch+'.json');if(r.ok){var d=await r.json();charDataCache[ch]=d;return d;}}catch(e){}
  }
  return null;
}
async function preloadAll(){
  document.getElementById('homeGreeting').textContent='正在加载字库...';
  var batch=10;
  for(var i=0;i<CHARS.length;i+=batch){
    var chunk=CHARS.slice(i,i+batch);
    await Promise.all(chunk.map(async function(ch){
      var d=await loadCharData(ch);
      if(d){strokeTypes[ch]=d.medians.map(function(m){return detectDir(m);});}
    }));
  }
  // 按笔画数排序
  charQueue=CHARS.filter(function(c){return charDataCache[c];}).sort(function(a,b){
    return (charDataCache[a].strokes.length)-(charDataCache[b].strokes.length);
  });
  // 同笔画内随机
  var groups={};charQueue.forEach(function(c){var s=charDataCache[c].strokes.length;if(!groups[s])groups[s]=[];groups[s].push(c);});
  charQueue=[];Object.keys(groups).map(Number).sort(function(a,b){return a-b;}).forEach(function(s){
    var g=groups[s];for(var i=g.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=g[i];g[i]=g[j];g[j]=t;}
    charQueue=charQueue.concat(g);
  });
  queueIdx=0;
  document.getElementById('homeGreeting').textContent='今天也要加油哦！';
}
function nextInQueue(){
  if(queueIdx>=charQueue.length)queueIdx=0;
  return charQueue[queueIdx++];
}
// ===== 屏幕切换 =====
function showScreen(name){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.getElementById('screen-'+name).classList.add('active');
  currentMode=name;
}
function goHome(){
  stopBGM();updateHomeStats();showScreen('home');
}
function updateHomeStats(){
  document.getElementById('homeStars').textContent='⭐ '+stars;
  document.getElementById('homeCombo').textContent='🔥 最高连击 '+maxCombo;
  document.getElementById('homeAnimals').textContent='🐼 收藏 '+collected.length+'/8';
}
function enterMode(mode){
  if(mode==='quiz')startQuiz();
  else if(mode==='labels')startLabels();
  else if(mode==='write')startWrite();
  else if(mode==='collection')showCollection();
}
// ===== 星星系统 =====
function addStars(n){
  stars+=n;localStorage.setItem('hz_stars',stars);
  checkUnlock();updateAllStarDisplays();
}
function updateAllStarDisplays(){
  document.getElementById('homeStars').textContent='⭐ '+stars;
  document.getElementById('quizStars').textContent='⭐ '+stars;
  document.getElementById('writeStars').textContent='⭐ '+stars;
  document.getElementById('colStars').textContent='⭐ '+stars;
}
function checkUnlock(){
  var shouldHave=Math.min(8,Math.floor(stars/50));
  while(collected.length<shouldHave){
    var idx=collected.length;
    collected.push(REWARDS[idx].n);
    localStorage.setItem('hz_collected',JSON.stringify(collected));
    setTimeout(function(){showUnlockCelebration(REWARDS[idx]);},500);
  }
}
function showUnlockCelebration(reward){
  var overlay=document.getElementById('rewardOverlay');
  document.getElementById('rewardAnimal').textContent=reward.e;
  document.getElementById('rewardAnimal').className='reward-animal';
  document.getElementById('rewardText').textContent='解锁新动物：'+reward.n+'！';
  document.getElementById('rewardText').style.animation='none';
  void document.getElementById('rewardText').offsetWidth;
  document.getElementById('rewardText').style.animation='textPop .8s ease-out forwards';
  spawnConfetti();overlay.classList.add('active');sndReward();
  setTimeout(function(){overlay.classList.remove('active');},3500);
}
function showComboEffect(c){
  if(c<3)return;
  var el=document.createElement('div');el.className='combo-display';
  el.textContent=c>=10?'无敌连击 x'+c+'!!!':c>=5?'超级连击 x'+c+'!!':'连击 x'+c+'!';
  document.body.appendChild(el);setTimeout(function(){el.remove();},1200);
}
function spawnStarFly(x,y){
  for(var i=0;i<3;i++){
    var s=document.createElement('div');s.className='star-fly';s.textContent='⭐';
    s.style.left=(x+Math.random()*40-20)+'px';s.style.top=(y-10)+'px';
    s.style.animationDelay=(i*0.15)+'s';document.body.appendChild(s);
    setTimeout(function(el){return function(){el.remove();};}(s),1200);
  }
}
// ===== 彩蛋 =====
function spawnConfetti(){
  var bg=document.getElementById('rewardBg');bg.innerHTML='';
  for(var i=0;i<25;i++){var c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.backgroundColor=CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];c.style.animationDelay=Math.random()*1.5+'s';c.style.animationDuration=(2+Math.random()*2)+'s';c.style.width=(6+Math.random()*8)+'px';c.style.height=(6+Math.random()*8)+'px';bg.appendChild(c);}
}
function showRewardEgg(){
  var r=REWARDS[Math.floor(Math.random()*REWARDS.length)];
  var p=PRAISES[Math.floor(Math.random()*PRAISES.length)];
  document.getElementById('rewardAnimal').textContent=r.e;
  document.getElementById('rewardAnimal').className='reward-animal';
  document.getElementById('rewardText').textContent=p;
  document.getElementById('rewardText').style.animation='none';void document.getElementById('rewardText').offsetWidth;
  document.getElementById('rewardText').style.animation='textPop .8s ease-out forwards';
  spawnConfetti();document.getElementById('rewardOverlay').classList.add('active');sndReward();
  setTimeout(function(){document.getElementById('rewardOverlay').classList.remove('active');},3500);
}
</script>
<script>
// ===== 笔顺大闯关 =====
var bgmPlaying=false,bgmInterval=null,bgmEnabled=true;
function toggleBGM(){
  bgmEnabled=!bgmEnabled;
  document.getElementById('bgmToggle').textContent=bgmEnabled?'🔊 音乐':'🔇 静音';
  if(bgmEnabled&&currentMode==='quiz')startBGM();
  else stopBGM();
}
function startQuiz(){
  quizLevel=0;combo=0;showScreen('quiz');updateQuizUI();
  if(bgmEnabled)startBGM();
  nextQuizQuestion();
}
function stopBGM(){if(bgmInterval){clearInterval(bgmInterval);bgmInterval=null;}bgmPlaying=false;}
function startBGM(){
  if(bgmPlaying)return;bgmPlaying=true;
  // 简单欢快的背景旋律
  var melody=[523,587,659,523,659,587,523,392,440,523,587,659,784,659,587,523];
  var idx=0;
  bgmInterval=setInterval(function(){
    if(!bgmPlaying){clearInterval(bgmInterval);return;}
    tone(melody[idx%melody.length],.18,'triangle');
    idx++;
  },280);
}
function updateQuizUI(){
  document.getElementById('quizStars').textContent='⭐ '+stars;
  document.getElementById('quizCombo').textContent='🔥 x'+combo;
  document.getElementById('quizLevel').textContent='第 '+(quizLevel+1)+' 关';
  document.getElementById('quizProgress').style.width=((quizLevel%5)/5*100)+'%';
}
async function nextQuizQuestion(){
  var ch=nextInQueue();
  var data=await loadCharData(ch);
  if(!data){nextQuizQuestion();return;}
  currentChar=ch;
  var numStrokes=data.strokes.length;
  var dirs=strokeTypes[ch]||data.medians.map(detectDir);
  // 随机选择题型: 60%数笔画, 40%方向题
  var qType=Math.random()<0.6?'count':'dir';
  var questionText,correctAnswer,options;
  if(qType==='count'){
    questionText='「'+ch+'」字一共有几笔？';
    correctAnswer=String(numStrokes);
    // 生成数字选项
    var nums=[numStrokes];
    while(nums.length<4){
      var r=numStrokes+Math.floor(Math.random()*5)-2;
      if(r>=1&&r<=20&&nums.indexOf(r)===-1)nums.push(r);
    }
    options=nums.sort(function(){return Math.random()-.5;}).map(String);
  }else{
    var tIdx=Math.floor(Math.random()*numStrokes);
    var ordinals=['一','二','三','四','五','六','七','八','九','十'];
    questionText='「'+ch+'」的第'+(ordinals[tIdx]||tIdx+1)+'笔往哪个方向写？';
    var correctCode=dirs[tIdx];
    correctAnswer=correctCode;
    // 生成方向选项
    var usedCodes=[correctCode];
    var allCodes=DIRS.map(function(d){return d.code;}).filter(function(c){return c!==correctCode;});
    while(usedCodes.length<4){var rc=allCodes.splice(Math.floor(Math.random()*allCodes.length),1)[0];if(rc)usedCodes.push(rc);}
    options=usedCodes.sort(function(){return Math.random()-.5;});
  }
  document.getElementById('quizQuestion').textContent=questionText;
  document.getElementById('quizFeedback').textContent='';
  // 渲染字符
  var box=document.getElementById('quizCharBox');box.innerHTML='';
  var size=Math.min(box.offsetWidth,box.offsetHeight)||260;
  writer=HanziWriter.create(box,ch,{width:size,height:size,padding:Math.round(size*.08),renderer:'svg',showOutline:true,showCharacter:true,strokeColor:'#333',outlineColor:'#ddd',highlightColor:'#FF6F00',charDataLoader:function(c,cb){cb(data);}});
  // 播放笔顺动画提示
  setTimeout(function(){writer.animateCharacter();},500);
  // 渲染选项按钮
  var optDiv=document.getElementById('quizOptions');optDiv.innerHTML='';
  options.forEach(function(opt){
    var btn=document.createElement('button');btn.className='opt-btn';
    if(qType==='count'){
      btn.innerHTML='<span style="font-size:32px;font-weight:bold">'+opt+'</span><br><span style="font-size:13px;color:#888">笔</span>';
    }else{
      var d=DIRS.find(function(x){return x.code===opt;});
      btn.innerHTML='<span style="font-size:36px">'+(d?d.icon:'➡️')+'</span><br><span style="font-size:14px;color:#555">'+(d?d.label:'')+'</span>';
    }
    btn.onclick=function(){handleAnswer(opt,correctAnswer,btn,optDiv,qType);};
    optDiv.appendChild(btn);
  });
}
function handleAnswer(selected,correct,btn,optDiv,qType){
  var btns=optDiv.querySelectorAll('.opt-btn');
  btns.forEach(function(b){b.disabled=true;});
  if(selected===correct){
    btn.classList.add('correct');combo++;quizLevel++;
    if(combo>maxCombo){maxCombo=combo;localStorage.setItem('hz_maxCombo',maxCombo);}
    var bonus=combo>=5?3:combo>=3?2:1;
    addStars(bonus);sndOk();showComboEffect(combo);speakPraise();
    var rect=btn.getBoundingClientRect();
    spawnStarFly(rect.left+rect.width/2,rect.top);
    document.getElementById('quizFeedback').innerHTML='<span style="color:#69F0AE">✓ 答对了！+'+bonus+'星</span>';
    updateQuizUI();
    if(quizLevel%5===0)setTimeout(showRewardEgg,600);
    setTimeout(nextQuizQuestion,1200);
  }else{
    btn.classList.add('wrong');combo=0;sndNo();
    // 显示正确答案
    btns.forEach(function(b){
      var bOpt=b.querySelector('span')?b.querySelector('span').textContent:'';
      if(qType==='count'&&bOpt===correct)b.classList.add('reveal');
      if(qType==='dir'){var d=DIRS.find(function(x){return x.icon===bOpt;});if(d&&d.code===correct)b.classList.add('reveal');}
    });
    var correctLabel=qType==='count'?correct+'笔':(DIRS.find(function(d){return d.code===correct;})||{icon:'',label:''}).label;
    document.getElementById('quizFeedback').innerHTML='<span style="color:#FFAB91">✗ 正确答案是 '+correctLabel+'</span>';
    quizLevel++;updateQuizUI();
    setTimeout(nextQuizQuestion,2500);
  }
}
// ===== 语音配音 =====
function speakPraise(){
  try{
    var text=VOICE_PRAISE[Math.floor(Math.random()*VOICE_PRAISE.length)];
    var u=new SpeechSynthesisUtterance(text);
    u.lang='zh-CN';u.rate=1.1;u.pitch=1.3;u.volume=1;
    var voices=speechSynthesis.getVoices();
    var zhVoice=voices.find(function(v){return v.lang.indexOf('zh')===0;});
    if(zhVoice)u.voice=zhVoice;
    speechSynthesis.speak(u);
  }catch(e){}
}
function speakEncourage(){
  try{
    var u=new SpeechSynthesisUtterance('没关系，再试一次！');
    u.lang='zh-CN';u.rate=1;u.pitch=1.2;
    speechSynthesis.speak(u);
  }catch(e){}
}
// ===== 火眼金睛 =====
var labelWriter=null,labelData=null,labelIdx=0;
async function startLabels(){
  showScreen('labels');labelIdx=0;await loadLabelChar(nextInQueue());
}
async function loadLabelChar(ch){
  currentChar=ch;
  var data=await loadCharData(ch);if(!data)return;
  labelData=data;
  document.getElementById('labelCharName').textContent='「'+ch+'」'+data.strokes.length+'画';
  var box=document.getElementById('labelCharBox');
  box.querySelectorAll('svg').forEach(function(s){s.remove();});
  var size=Math.min(box.offsetWidth,box.offsetHeight)||260;
  var pad=Math.round(size*.08);
  labelWriter=HanziWriter.create(box,ch,{width:size,height:size,padding:pad,renderer:'svg',showOutline:true,showCharacter:true,strokeColor:'#333',outlineColor:'#ddd',highlightColor:'#FF6F00',charDataLoader:function(c,cb){cb(data);}});
  // 渲染编号标签
  var labelsDiv=document.getElementById('strokeLabels');labelsDiv.innerHTML='';
  var scale=(size-2*pad)/1024;
  data.medians.forEach(function(m,i){
    var x=pad+m[0][0]*scale-13;
    var y=pad+(1024-m[0][1])*scale-13;
    var el=document.createElement('div');el.className='stroke-num';el.textContent=(i+1);
    el.style.left=x+'px';el.style.top=y+'px';
    el.onmouseenter=function(){highlightStrokeLabel(i);};
    el.onclick=function(){playSingleStroke(i);};
    labelsDiv.appendChild(el);
  });
  // 显示笔画方向列表
  var types=strokeTypes[ch]||data.medians.map(detectDir);
  var circled='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮';
  var info=types.map(function(t,i){
    var d=DIRS.find(function(x){return x.code===t;});
    return circled[i]+(d?d.icon:'');
  }).join(' ');
  document.getElementById('labelsInfo').innerHTML='<span style="font-size:18px">'+info+'</span>';
}
function highlightStrokeLabel(idx){
  var labels=document.querySelectorAll('#strokeLabels .stroke-num');
  labels.forEach(function(l,i){l.classList.toggle('active',i===idx);});
}
function playSingleStroke(idx){
  if(!labelWriter)return;
  highlightStrokeLabel(idx);
  labelWriter.animateStroke(idx,function(){},function(){});
}
function labelsPlay(){
  if(!labelWriter||!labelData)return;
  var total=labelData.medians.length,i=0;
  function playNext(){
    if(i>=total){
      document.querySelectorAll('#strokeLabels .stroke-num').forEach(function(l){l.classList.add('done');});
      document.getElementById('labelsInfo').textContent='全部笔画播放完毕！';
      return;
    }
    highlightStrokeLabel(i);
    labelWriter.animateStroke(i,function(){},function(){});
    i++;setTimeout(playNext,700);
  }
  labelWriter.hideCharacter(function(){playNext();});
}
function labelsNext(){loadLabelChar(nextInQueue());}
// ===== 妙笔生花 =====
var writeWriter=null;
async function startWrite(){
  showScreen('write');writeTotal=0;
  document.getElementById('writeCount').textContent='已写 0 字';
  await loadWriteChar(nextInQueue());
}
async function loadWriteChar(ch){
  currentChar=ch;
  var data=await loadCharData(ch);if(!data){loadWriteChar(nextInQueue());return;}
  document.getElementById('writeStatus').innerHTML='<span style="color:#B3E5FC">「'+ch+'」- 先看动画，再用鼠标跟着写！</span>';
  var box=document.getElementById('writeCharBox');box.innerHTML='';
  var size=Math.min(box.offsetWidth,box.offsetHeight)||260;
  writeWriter=HanziWriter.create(box,ch,{width:size,height:size,padding:Math.round(size*.08),renderer:'svg',showOutline:true,showCharacter:true,strokeColor:'#333',outlineColor:'#ddd',highlightColor:'#789',showHintAfterMisses:3,highlightOnComplete:true,charDataLoader:function(c,cb){cb(data);},onCorrectStroke:function(){tone(880,.1);},onMistake:function(){tone(220,.25,'square');}});
  writeWriter.animateCharacter({onComplete:function(){startWriteQuiz();}});
}
function startWriteQuiz(){
  document.getElementById('writeStatus').innerHTML='<span style="color:#69F0AE">该你啦！用鼠标跟着写！</span>';
  writeWriter.quiz({onComplete:function(summary){
    writeTotal++;addStars(summary.totalMistakes===0?3:1);sndDone();speakPraise();
    document.getElementById('writeCount').textContent='已写 '+writeTotal+' 字';
    document.getElementById('writeStatus').innerHTML=summary.totalMistakes===0?'<span style="color:#FFD740">完美！+3星</span>':'<span style="color:#B3E5FC">写完了！错了'+summary.totalMistakes+'次 +1星</span>';
    if(writeTotal%5===0)setTimeout(showRewardEgg,800);
    else setTimeout(function(){loadWriteChar(nextInQueue());},1500);
  }});
}
function writeDemo(){if(writeWriter)writeWriter.animateCharacter({onComplete:startWriteQuiz});}
function writeRetry(){if(writeWriter)startWriteQuiz();}
function writeNext(){loadWriteChar(nextInQueue());}
// ===== 收藏页 =====
function showCollection(){
  showScreen('collection');
  var grid=document.getElementById('collectionGrid');grid.innerHTML='';
  REWARDS.forEach(function(r,i){
    var unlocked=i<collected.length;
    var card=document.createElement('div');card.className='collect-card'+(unlocked?'':' locked');
    card.innerHTML='<span class="emoji">'+r.e+'</span><span class="name">'+r.n+'</span>'+(unlocked?'':'<span class="need">'+((i+1)*50)+'星解锁</span>');
    grid.appendChild(card);
  });
  document.getElementById('colStars').textContent='⭐ '+stars;
}
// ===== 初始化 =====
async function boot(){
  if(typeof HanziWriter==='undefined'){await new Promise(function(r){var t=setInterval(function(){if(window._hwLoaded||window._hwFailed){clearInterval(t);r();}},100);});}
  if(typeof HanziWriter==='undefined'){document.getElementById('homeGreeting').textContent='加载失败，请检查网络后刷新';return;}
  updateHomeStats();await preloadAll();
}
window.addEventListener('DOMContentLoaded',boot);
</script>
